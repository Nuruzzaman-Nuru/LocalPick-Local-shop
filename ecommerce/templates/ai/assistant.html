{% extends "base.html" %}

{% block title %}AI Assistant{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>AI Assistant</h2>
        <button class="btn btn-outline-secondary" id="printPageBtn">
            <i class="bi bi-printer"></i> Print
        </button>
    </div>

    <div class="card" style="background: linear-gradient(180deg, #fbfbff, #ffffff); border: 1px solid rgba(0,0,0,0.04);">
        <div class="card-body">
            <p class="lead">Use the Print button to create a hard copy or PDF of this page.</p>
            <div id="assistantContent">
              
                <p>No conversation yet.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('printPageBtn').addEventListener('click', function() {
    window.print();
});
</script>
{% endblock %}
