{% extends 'base.html' %}

{% block content %}
<div class="container">
  <h2>AI Negotiation Assistant (Demo)</h2>
  <p>This demo calls a local negotiation bot for a product id and offered price.</p>

  <div>
    <label>Product ID: <input id="product_id" type="number" value="1"></label>
  </div>
  <div>
    <label>Offered Price: <input id="offered_price" type="number" step="0.01" value="5.00"></label>
  </div>
  <div>
    <button id="negotiateBtn">Negotiate</button>
  </div>

  <div id="result" style="margin-top:1rem"></div>
</div>

<script>
document.getElementById('negotiateBtn').addEventListener('click', async function(){
  const product_id = parseInt(document.getElementById('product_id').value, 10);
  const offered_price = parseFloat(document.getElementById('offered_price').value);

  const resp = await fetch('/ai/negotiate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({product_id, offered_price})
  });

  const data = await resp.json();
  const el = document.getElementById('result');
  if(data.status !== 'success'){
    el.innerText = 'Error: ' + (data.message || JSON.stringify(data));
    return;
  }

  el.innerText = JSON.stringify(data, null, 2);
});
</script>

{% endblock %}
