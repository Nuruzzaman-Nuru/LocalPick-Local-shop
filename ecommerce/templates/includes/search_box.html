{% set search_type = search_type|default('all') %}

<!-- Dark rounded search panel matching mockup -->
<div class="search-panel">
    <form class="search-form" action="{{ url_for('main.search') }}" method="GET">
        <div class="search-buttons mb-2">
            <button type="button" class="search-btn active" data-search-type="all">
                <i class="bi bi-search me-2"></i> All
            </button>
            <button type="button" class="search-btn" data-search-type="products">
                <i class="bi bi-box me-2"></i> Products
            </button>
            <button type="button" class="search-btn" data-search-type="shops">
                <i class="bi bi-shop me-2"></i> Shops
            </button>
        </div>

        <div class="search-inner">
            <div class="input-group search-container">
                <input class="form-control search-input" type="search" name="q"
                       placeholder="কি খুঁজছেন?"
                       value="{{ request.args.get('q', '') }}"
                       aria-label="Search" autocomplete="off" aria-autocomplete="list">
                {% if search_type != 'all' %}
                    <input type="hidden" name="type" value="{{ search_type }}">
                {% else %}
                    <input type="hidden" name="type" value="all">
                {% endif %}
                <button class="btn btn-search" type="submit" aria-label="Search">
                    <i class="bi bi-search"></i>
                    <span class="visually-hidden">Search</span>
                </button>
                <div class="search-suggestions" role="listbox" aria-label="Search suggestions">
                    <!-- Suggestions will be populated here -->
                </div>
            </div>
        </div>

        <div class="search-bottom d-flex align-items-center justify-content-between">
            <label class="form-check-label d-flex align-items-center">
                <input type="checkbox" class="form-check-input me-2" id="useLocation">
                <i class="bi bi-geo-alt"></i>
                <small class="ms-2">Use my location</small>
            </label>

            <div class="popular-searches">
                <a href="{{ url_for('main.search', q='Electronics') }}" class="chip">Electronics</a>
                <a href="{{ url_for('main.search', q='Fashion') }}" class="chip">Fashion</a>
                <a href="{{ url_for('main.search', q='Groceries') }}" class="chip">Groceries</a>
                <a href="{{ url_for('main.search', q='Local Shops') }}" class="chip">Local Shops</a>
            </div>

            <style>
                /* Fix search button styles to match screenshot */
                .search-input {
                    font-family: 'SolaimanLipi', Arial, sans-serif !important;
                    height: 46px;
                    background: #fff !important;
                    border: none !important;
                    color: #333 !important;
                    font-size: 16px !important;
                    padding: 8px 16px !important;
                }
                
                .search-input::placeholder {
                    color: #666 !important;
                }

                .btn-search {
                    background: #7e3af2 !important;
                    width: 46px;
                    height: 46px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 0 8px 8px 0 !important;
                    transition: all 0.2s ease;
                }

                .btn-search:hover {
                    background: #6929d8 !important;
                }

                .search-buttons {
                    background: #2d3339;
                    border-radius: 8px;
                    padding: 4px;
                    display: inline-flex;
                    gap: 0;
                }

                .search-btn {
                    border-radius: 6px;
                    padding: 8px 16px;
                    color: #fff;
                    font-weight: 500;
                    font-size: 14px;
                }

                .search-btn.active {
                    background: rgba(255,255,255,0.1);
                }

                .search-container {
                    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    border-radius: 8px;
                }
            </style>
        </div>
    </form>
</div>

<style>
.search-container {
    position: relative;
}

.search-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #2d3339;
    border: none;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    margin-top: 4px;
}

.suggestion-item.active,
.suggestion-item:focus {
    background-color: rgba(255,255,255,0.1);
    outline: none;
}

.suggestion-loading {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.1);
    border-left-color: #8528ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
    color: #fff;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.suggestion-item {
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    color: #333;
    text-decoration: none;
    transition: background-color 0.2s;
    border-bottom: 1px solid #eee;
}

.suggestion-item:last-child {
    border-bottom: none;
}

.suggestion-item:hover {
    background-color: #f8f9fa;
    text-decoration: none;
}

.suggestion-icon {
    margin-right: 0.75rem;
    color: #6c757d;
    width: 20px;
    text-align: center;
}

.suggestion-content {
    flex: 1;
}

.suggestion-title {
    font-weight: 500;
    margin-bottom: 0.25rem;
}

.suggestion-metadata {
    font-size: 0.875rem;
    color: #6c757d;
}

.search-input:focus {
    box-shadow: none;
    border-color: #80bdff;
}

.search-form .btn-outline-primary {
    border-color: #ced4da;
}

.search-form .btn-outline-primary:hover {
    background-color: #007bff;
    border-color: #007bff;
    color: white;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchContainers = document.querySelectorAll('.search-container');

    searchContainers.forEach(container => {
        const searchInput = container.querySelector('.search-input');
        const suggestionsContainer = container.querySelector('.search-suggestions');
        let debounceTimer = null;
        let controller = null; // For aborting previous fetches

        function clearSuggestions() {
            suggestionsContainer.innerHTML = '';
            suggestionsContainer.style.display = 'none';
        }

        function renderSuggestions(list) {
            suggestionsContainer.innerHTML = '';
            list.forEach(suggestion => {
                const item = document.createElement('a');
                item.className = 'suggestion-item';
                item.href = suggestion.url || '#';
                item.setAttribute('role', 'option');
                item.tabIndex = -1;

                const icon = suggestion.type === 'product' ? 'box' : 'shop';
                const metadata = suggestion.type === 'product'
                    ? `${suggestion.category || 'Uncategorized'} · ৳${(suggestion.price||0).toFixed(2)}`
                    : 'Shop';

                item.innerHTML = `
                    <i class="bi bi-${icon} suggestion-icon" aria-hidden="true"></i>
                    <div class="suggestion-content">
                        <div class="suggestion-title">${suggestion.name}</div>
                        <div class="suggestion-metadata">${metadata}</div>
                    </div>
                `;

                // click/tap handler
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (item.href && item.href !== '#') window.location.href = item.href;
                });

                suggestionsContainer.appendChild(item);
            });

            if (list.length > 0) {
                suggestionsContainer.style.display = 'block';
                suggestionsContainer.setAttribute('role', 'listbox');
            } else {
                clearSuggestions();
            }
        }

        function showLoading() {
            suggestionsContainer.innerHTML = '<div class="px-3 py-2">Searching <span class="suggestion-loading" aria-hidden="true"></span></div>';
            suggestionsContainer.style.display = 'block';
        }

        searchInput.addEventListener('input', function() {
            const q = this.value.trim();
            if (debounceTimer) clearTimeout(debounceTimer);

            if (q.length < 2) {
                if (controller) controller.abort();
                clearSuggestions();
                return;
            }

            debounceTimer = setTimeout(() => {
                if (controller) controller.abort();
                controller = new AbortController();
                const signal = controller.signal;

                const shopId = container.closest('form').querySelector('input[name="shop_id"]')?.value;
                const params = new URLSearchParams({ q });
                if (shopId) params.append('shop_id', shopId);

                showLoading();

                fetch(`/api/search/suggestions?${params.toString()}`, { signal })
                    .then(res => {
                        if (!res.ok) throw new Error('Network response was not ok');
                        return res.json();
                    })
                    .then(data => renderSuggestions(data || []))
                    .catch(err => {
                        if (err.name === 'AbortError') return;
                        console.error('Search suggestions error:', err);
                        clearSuggestions();
                    });
            }, 250);
        });

        // Close suggestions when clicking outside
        document.addEventListener('click', function(e) {
            if (!container.contains(e.target)) clearSuggestions();
        });

        // Keyboard navigation with roving tabindex
        searchInput.addEventListener('keydown', function(e) {
            const items = suggestionsContainer.querySelectorAll('.suggestion-item');
            if (items.length === 0) return;

            const active = suggestionsContainer.querySelector('.suggestion-item.active');
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!active) {
                    const idx = e.key === 'ArrowDown' ? 0 : items.length - 1;
                    items[idx].classList.add('active');
                    items[idx].focus();
                } else {
                    const currentIndex = Array.from(items).indexOf(active);
                    active.classList.remove('active');
                    let nextIndex = currentIndex + (e.key === 'ArrowDown' ? 1 : -1);
                    if (nextIndex < 0) nextIndex = items.length - 1;
                    if (nextIndex >= items.length) nextIndex = 0;
                    items[nextIndex].classList.add('active');
                    items[nextIndex].focus();
                }
            } else if (e.key === 'Enter') {
                const first = suggestionsContainer.querySelector('.suggestion-item.active') || suggestionsContainer.querySelector('.suggestion-item');
                if (first) {
                    e.preventDefault();
                    first.click();
                }
            } else if (e.key === 'Escape') {
                clearSuggestions();
            }
        });
    });
});
</script>

<script>
// Tabs handler: switch search type and set hidden input
document.addEventListener('DOMContentLoaded', function() {
    const tabs = document.querySelectorAll('.search-tab');
    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            const type = this.getAttribute('data-search-type');
            tabs.forEach(t => t.setAttribute('aria-pressed','false'));
            this.setAttribute('aria-pressed','true');
            const form = this.closest('form');
            const typeInput = form.querySelector('input[name="type"]');
            if (typeInput) typeInput.value = type;
        });
    });
});
</script>
